name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install . pytest ruff
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Dogfood (examples must be linted as expected)
        run: |
          toolfit check -p mcp examples/mcp_tools_list.json
          if toolfit check -p openai-strict examples/openai_tools.json; then exit 1; fi
          toolfit fix examples/openai_tools.json | toolfit check -p openai-strict --fail-on never -
